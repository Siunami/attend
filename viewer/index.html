<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Attend</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="identity">
          <span class="wordmark">Attend</span>
          <span class="local-badge">Local viewer</span>
          <a class="library-return" href="../../">All views</a>
        </div>
        <div class="topbar-actions">
          <p id="corpus-meta" class="meta" aria-live="polite">Loading the local analysis…</p>
          <button
            id="chat-toggle"
            class="chat-toggle"
            type="button"
            aria-controls="chat-pane"
            aria-expanded="false"
          >
            Ask
            <span class="shortcut" aria-hidden="true">⌘/</span>
          </button>
        </div>
      </header>

      <main id="workspace" class="workspace" data-chat-open="false" data-area-select="false">
        <section id="map-pane" class="map-pane" aria-labelledby="question-heading">
          <header class="map-header">
            <p id="visualization-kind" class="eyebrow">Evidence visualization</p>
            <h1 id="question-heading">Loading question…</h1>
            <p id="question-target" class="target"></p>
          </header>

          <div id="empty-state" class="empty" hidden>
            No phrases meet this analysis threshold.
          </div>
          <ol id="phrase-list" class="phrase-list" aria-label="Recurring phrases"></ol>
          <section id="atlas-view" class="atlas-view" aria-labelledby="question-heading" hidden>
            <div id="atlas-visual" class="atlas-visual" aria-busy="false"></div>
            <p id="atlas-abstention" class="atlas-abstention" role="status" hidden></p>
          </section>
        </section>

        <aside
          id="chat-pane"
          class="chat-pane"
          aria-label="Chat"
          aria-hidden="true"
          inert
        >
          <header class="chat-header">
            <div class="chat-header-actions">
              <button
                id="chat-history"
                class="chat-icon-button"
                type="button"
                aria-label="Chat history"
                aria-controls="chat-history-panel"
                aria-expanded="false"
              >
                <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                  <path d="M12 4a8 8 0 1 0 8 8M12 7.5V12l3 2M4 4v5h5"></path>
                </svg>
              </button>
              <button id="chat-new" class="chat-icon-button" type="button" aria-label="New chat">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
              </button>
            </div>
            <button id="chat-close" class="chat-close" type="button" aria-label="Close chat">×</button>
          </header>

          <div id="chat-scroll" class="chat-scroll">
            <section id="chat-history-panel" class="chat-history-panel" hidden>
              <ol id="chat-thread-list" class="chat-thread-list" aria-label="Chat history"></ol>
            </section>
            <div id="conversation" class="conversation" aria-live="polite"></div>
          </div>

          <form id="chat-form" class="composer">
            <div class="composer-field">
              <section id="selection-panel" class="selection-panel" aria-live="polite" hidden></section>
              <div class="composer-input">
                <label for="chat-input" class="sr-only">Ask a question about this view</label>
                <textarea
                  id="chat-input"
                  rows="1"
                  placeholder="Ask about this view"
                ></textarea>
                <div id="suggested-question" class="suggested-question" hidden>
                  <span class="suggestion-key">Tab</span>
                  <span id="suggested-question-text"></span>
                </div>
              </div>
              <div class="composer-actions">
                <button
                  id="chat-area-select"
                  class="chat-icon-button chat-area-select"
                  type="button"
                  aria-pressed="false"
                  aria-label="Select an area of the visualization"
                  hidden
                >
                  <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                    <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path>
                  </svg>
                </button>
                <button id="chat-submit" class="chat-submit" type="submit" disabled>Ask</button>
              </div>
            </div>
            <p id="status" class="status" role="status"></p>
          </form>
        </aside>
      </main>
    </div>

    <script src="./vendor/d3.min.js"></script>
    <script src="./vendor/topojson-client.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
