<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Attend library</title>
    <link rel="stylesheet" href="./library.css">
  </head>
  <body>
    <main class="library-shell">
      <header class="library-header">
        <div>
          <div class="identity">
            <span class="wordmark">Attend</span>
            <span class="local-badge">Local library</span>
          </div>
          <h1>Your visualizations</h1>
          <p class="intro">Questions explored in this project, kept on this machine.</p>
        </div>
        <div class="library-actions">
          <a href="./families/">Family lab</a>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <p id="status" class="status" role="status">Loading saved views…</p>
      <section id="empty-state" class="empty-state" hidden>
        <h2>No visualizations yet</h2>
        <p>Create a visualization with Attend. New views will appear here.</p>
      </section>
      <ol id="session-list" class="session-list" aria-label="Saved visualizations"></ol>
    </main>

    <script type="module" src="./library.js"></script>
  </body>
</html>
